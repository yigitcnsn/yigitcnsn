<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 236" width="100%" height="236">
  <defs>
    <filter id="glowD" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feComposite in="SourceGraphic" in2="b" operator="over"/>
    </filter>
    <clipPath id="c1"><rect width="318" height="222" rx="14"/></clipPath>
    <clipPath id="c2"><rect width="318" height="222" rx="14"/></clipPath>
    <clipPath id="c3"><rect width="318" height="222" rx="14"/></clipPath>
    <style>
      .card { fill: #0C1220; stroke: #1E293B; stroke-width: 1.5; }
      .hdr  { font: 700 15.5px 'SF Pro Display', -apple-system, 'Segoe UI', Roboto, sans-serif; fill: #F8FAFC; }
      .tag  { font: 600 11px 'JetBrains Mono', 'SF Mono', monospace; }
      .body { font: 400 12.2px -apple-system, 'Segoe UI', Roboto, sans-serif; fill: #94A3B8; }
      .meta { font: 600 10.5px 'JetBrains Mono', 'SF Mono', monospace; fill: #94A3B8; }
      .pulse1 { animation: p1 2.4s ease-in-out infinite; }
      .pulse2 { animation: p1 2.4s ease-in-out infinite 0.8s; }
      .pulse3 { animation: p1 2.4s ease-in-out infinite 1.6s; }
      .border-run-1 { stroke-dasharray: 90 860; animation: runBorder 7s linear infinite; }
      .border-run-2 { stroke-dasharray: 90 860; animation: runBorder 7s linear infinite -2.3s; }
      .border-run-3 { stroke-dasharray: 90 860; animation: runBorder 7s linear infinite -4.6s; }
      .bus-line { stroke-dasharray: 6 10; animation: busFlow 1.8s linear infinite; }
      @keyframes p1 {
        0%, 100% { opacity: 1; }
        50%      { opacity: 0.3; }
      }
      @keyframes runBorder {
        from { stroke-dashoffset: 950; }
        to   { stroke-dashoffset: 0; }
      }
      @keyframes busFlow {
        from { stroke-dashoffset: 32; }
        to   { stroke-dashoffset: 0; }
      }
    </style>
  </defs>

  <!-- Animated Inter-Layer Data Bus Connecting All 3 Cards -->
  <line class="bus-line" x1="318" y1="118" x2="341" y2="118" stroke="#38BDF8" stroke-width="2" filter="url(#glowD)"/>
  <line class="bus-line" x1="659" y1="118" x2="682" y2="118" stroke="#A78BFA" stroke-width="2" filter="url(#glowD)"/>

  <!-- Card 1: Full-Stack, Native Apps & Developer Tools -->
  <g transform="translate(0, 6)" clip-path="url(#c1)">
    <rect class="card" width="318" height="222" rx="14"/>
    <rect class="border-run-1" x="1" y="1" width="316" height="220" rx="13" fill="none" stroke="#38BDF8" stroke-width="2.2"/>
    <rect x="20" y="0" width="96" height="3" rx="1.5" fill="#38BDF8"/>

    <circle class="pulse1" cx="28" cy="32" r="5" fill="#38BDF8" filter="url(#glowD)"/>
    <text x="42" y="37" class="hdr">Native Apps &amp; Full-Stack</text>
    <text x="20" y="64" class="tag" fill="#38BDF8" textLength="268" lengthAdjust="spacing">SwiftUI · TypeScript · Node · Flutter</text>

    <text x="20" y="92"  class="body" textLength="274" lengthAdjust="spacing">• Native macOS apps (Engram iCloud notes,</text>
    <text x="20" y="110" class="body" textLength="272" lengthAdjust="spacing">  AIUsageTracker WidgetKit, USB HID RGB)</text>
    <text x="20" y="134" class="body" textLength="274" lengthAdjust="spacing">• Modular WebSocket platforms (home-hub),</text>
    <text x="20" y="152" class="body" textLength="264" lengthAdjust="spacing">  FastAPI services &amp; Flutter mobile apps</text>

    <!-- Bottom Pill with animated progress bar & centered non-overflowing text -->
    <rect x="18" y="176" width="282" height="28" rx="7" fill="#111A2E" stroke="#1E293B" stroke-width="1"/>
    <text x="159" y="194" text-anchor="middle" class="meta" textLength="256" lengthAdjust="spacing">Swift 5.10 · React/Node · Dart · Docker</text>
  </g>

  <!-- Card 2: AI Tooling, Computer Vision & Automation -->
  <g transform="translate(341, 6)" clip-path="url(#c2)">
    <rect class="card" width="318" height="222" rx="14"/>
    <rect class="border-run-2" x="1" y="1" width="316" height="220" rx="13" fill="none" stroke="#A78BFA" stroke-width="2.2"/>
    <rect x="20" y="0" width="96" height="3" rx="1.5" fill="#A78BFA"/>

    <circle class="pulse2" cx="28" cy="32" r="5" fill="#A78BFA" filter="url(#glowD)"/>
    <text x="42" y="37" class="hdr">AI, Computer Vision &amp; Tools</text>
    <text x="20" y="64" class="tag" fill="#A78BFA" textLength="262" lengthAdjust="spacing">MCP · Local LLMs · OpenCV · Python</text>

    <text x="20" y="92"  class="body" textLength="272" lengthAdjust="spacing">• Model Context Protocol (vaultwire MCP)</text>
    <text x="20" y="110" class="body" textLength="268" lengthAdjust="spacing">  &amp; local Ollama disclosure classifiers</text>
    <text x="20" y="134" class="body" textLength="274" lengthAdjust="spacing">• PrismDesk camera-projector homography</text>
    <text x="20" y="152" class="body" textLength="268" lengthAdjust="spacing">  AR desk &amp; automated optical QC vision</text>

    <rect x="18" y="176" width="282" height="28" rx="7" fill="#111A2E" stroke="#1E293B" stroke-width="1"/>
    <text x="159" y="194" text-anchor="middle" class="meta" textLength="256" lengthAdjust="spacing">OpenCV · PyQt/ATE · Ollama · WebSocket</text>
  </g>

  <!-- Card 3: Systems Programming, Bare-Linux & RTOS -->
  <g transform="translate(682, 6)" clip-path="url(#c3)">
    <rect class="card" width="318" height="222" rx="14"/>
    <rect class="border-run-3" x="1" y="1" width="316" height="220" rx="13" fill="none" stroke="#34D399" stroke-width="2.2"/>
    <rect x="20" y="0" width="96" height="3" rx="1.5" fill="#34D399"/>

    <circle class="pulse3" cx="28" cy="32" r="5" fill="#34D399" filter="url(#glowD)"/>
    <text x="42" y="37" class="hdr">Systems, Bare-Linux &amp; RTOS</text>
    <text x="20" y="64" class="tag" fill="#34D399" textLength="270" lengthAdjust="spacing">C/C++ · Embedded Linux · Zephyr RTOS</text>

    <text x="20" y="92"  class="body" textLength="274" lengthAdjust="spacing">• Custom C OS on ARMv7 tablet (0% Android,</text>
    <text x="20" y="110" class="body" textLength="274" lengthAdjust="spacing">  60MB RAM, Wacom EMR engine, DHCP, mDNS)</text>
    <text x="20" y="134" class="body" textLength="274" lengthAdjust="spacing">• Production STM32 / nRF52 / ESP32 RTOS,</text>
    <text x="20" y="152" class="body" textLength="264" lengthAdjust="spacing">  custom C++ HALs, BLE FOTA &amp; KiCad PCBs</text>

    <rect x="18" y="176" width="282" height="28" rx="7" fill="#111A2E" stroke="#1E293B" stroke-width="1"/>
    <text x="159" y="194" text-anchor="middle" class="meta" textLength="256" lengthAdjust="spacing">Linux Kernel/fb0 · FreeRTOS · KiCad 10</text>
  </g>
</svg>
