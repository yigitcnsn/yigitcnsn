<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 280" width="100%" height="280">
  <defs>
    <pattern id="dotGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="0.8" fill="#30363D" fill-opacity="0.7"/>
    </pattern>
    <!-- Terminal typewriter reveal masks -->
    <clipPath id="tCmd">
      <rect x="18" y="42" width="0" height="20">
        <animate attributeName="width" values="0;280;280;0" keyTimes="0;0.14;0.94;1" dur="12s" repeatCount="indefinite"/>
      </rect>
    </clipPath>
    <clipPath id="t1">
      <rect x="18" y="66" width="0" height="20">
        <animate attributeName="width" values="0;0;310;310;0" keyTimes="0;0.14;0.24;0.94;1" dur="12s" repeatCount="indefinite"/>
      </rect>
    </clipPath>
    <clipPath id="t2">
      <rect x="18" y="86" width="0" height="20">
        <animate attributeName="width" values="0;0;310;310;0" keyTimes="0;0.24;0.34;0.94;1" dur="12s" repeatCount="indefinite"/>
      </rect>
    </clipPath>
    <clipPath id="t3">
      <rect x="18" y="106" width="0" height="20">
        <animate attributeName="width" values="0;0;310;310;0" keyTimes="0;0.34;0.44;0.94;1" dur="12s" repeatCount="indefinite"/>
      </rect>
    </clipPath>
    <clipPath id="t4">
      <rect x="18" y="126" width="0" height="22">
        <animate attributeName="width" values="0;0;310;310;0" keyTimes="0;0.44;0.54;0.94;1" dur="12s" repeatCount="indefinite"/>
      </rect>
    </clipPath>
    <style>
      .name  { font: 700 32px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #E6EDF3; letter-spacing: -0.4px; }
      .role  { font: 500 14.5px ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace; fill: #58A6FF; }
      .quote { font: italic 400 13px -apple-system, BlinkMacSystemFont, 'Segoe UI', Georgia, serif; fill: #8B949E; }
      .q-hi  { font: italic 600 13px -apple-system, BlinkMacSystemFont, 'Segoe UI', Georgia, serif; fill: #E6EDF3; }
      .bio   { font: 400 13.5px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, sans-serif; fill: #8B949E; }
      .pill  { font: 500 11.5px ui-monospace, SFMono-Regular, 'SF Mono', Menlo, monospace; fill: #C9D1D9; }
      .thdr  { font: 500 11px ui-monospace, SFMono-Regular, 'SF Mono', Menlo, monospace; fill: #6E7681; }
      .ttxt  { font: 400 11.5px ui-monospace, SFMono-Regular, 'SF Mono', Menlo, monospace; fill: #C9D1D9; }
      .tok   { font: 600 11.5px ui-monospace, SFMono-Regular, 'SF Mono', Menlo, monospace; fill: #3FB950; }
      .tcmd  { font: 500 11.5px ui-monospace, SFMono-Regular, 'SF Mono', Menlo, monospace; fill: #58A6FF; }
      .cur   { animation: blink 1s step-end infinite; }
      .dot   { animation: pulse 2.4s ease-in-out infinite; }
      .wave  { stroke-dasharray: 380; stroke-dashoffset: 380; animation: draw 3.2s ease-in-out infinite alternate; }
      @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
      @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
      @keyframes draw  { 0% { stroke-dashoffset: 240; } 100% { stroke-dashoffset: 0; } }
    </style>
  </defs>

  <!-- Clean Matte GitHub-Dark Card -->
  <rect width="1000" height="280" rx="10" fill="#0D1117"/>
  <rect width="1000" height="280" rx="10" fill="url(#dotGrid)"/>
  <rect x="0.5" y="0.5" width="999" height="279" rx="9.5" fill="none" stroke="#30363D" stroke-width="1"/>

  <!-- Left Column: Crisp Typography -->
  <g transform="translate(36, 34)">
    <circle class="dot" cx="6" cy="8" r="4" fill="#3FB950"/>
    <text x="18" y="12" class="thdr" fill="#8B949E">ISTANBUL, TR  ·  SOFTWARE &amp; EMBEDDED SYSTEMS</text>

    <text x="0" y="54" class="name">Ahmet Yiğitcan Şen</text>
    <text x="0" y="78" class="role">Software Engineer  ·  Systems, AI &amp; Silicon</text>

    <!-- Understated Quote Bar -->
    <line x1="2" y1="96" x2="2" y2="116" stroke="#3FB950" stroke-width="2.5"/>
    <text x="14" y="111" class="quote">“A jack of all trades is a master of none, <tspan class="q-hi">but oftentimes better than a master of one.</tspan>”</text>

    <text x="0" y="144" class="bio">Building across the stack: native macOS &amp; mobile apps, WebSocket backends, MCP/AI</text>
    <text x="0" y="164" class="bio">tooling, computer-vision workbenches, bare-Linux C OSes, and Zephyr/STM32 firmware.</text>

    <!-- Minimal Monospace Tag Pills -->
    <g transform="translate(0, 188)">
      <rect x="0"   y="0" width="94"  height="26" rx="5" fill="#161B22" stroke="#30363D"/>
      <text x="47"  y="17" text-anchor="middle" class="pill">Swift · TS</text>

      <rect x="102" y="0" width="106" height="26" rx="5" fill="#161B22" stroke="#30363D"/>
      <text x="155" y="17" text-anchor="middle" class="pill">Python · CV</text>

      <rect x="216" y="0" width="90"  height="26" rx="5" fill="#161B22" stroke="#30363D"/>
      <text x="261" y="17" text-anchor="middle" class="pill">C / C++20</text>

      <rect x="314" y="0" width="114" height="26" rx="5" fill="#161B22" stroke="#30363D"/>
      <text x="371" y="17" text-anchor="middle" class="pill">Linux · RTOS</text>

      <rect x="436" y="0" width="112" height="26" rx="5" fill="#161B22" stroke="#30363D"/>
      <text x="492" y="17" text-anchor="middle" class="pill">STM32 · PCB</text>
    </g>
  </g>

  <!-- Right Column: Minimal Terminal & Logic Trace -->
  <g transform="translate(626, 24)">
    <rect width="344" height="232" rx="8" fill="#161B22" stroke="#30363D" stroke-width="1"/>
    <line x1="0" y1="28" x2="344" y2="28" stroke="#30363D" stroke-width="1"/>
    <circle cx="15" cy="14" r="4.5" fill="#484F58"/>
    <circle cx="29" cy="14" r="4.5" fill="#484F58"/>
    <circle cx="43" cy="14" r="4.5" fill="#484F58"/>
    <text x="64" y="18" class="thdr">yigit@macbook-pro: ~/developer</text>

    <g clip-path="url(#tCmd)">
      <text x="16" y="54" class="tcmd">$ uname -a &amp;&amp; stack --summary</text>
    </g>
    <g clip-path="url(#t1)">
      <text x="16" y="78" class="tok">app </text>
      <text x="52" y="78" class="ttxt">SwiftUI · Flutter · Node · FastAPI</text>
    </g>
    <g clip-path="url(#t2)">
      <text x="16" y="98" class="tok">ai  </text>
      <text x="52" y="98" class="ttxt">MCP Servers · Ollama · OpenCV AR</text>
    </g>
    <g clip-path="url(#t3)">
      <text x="16" y="118" class="tok">sys </text>
      <text x="52" y="118" class="ttxt">Bare-Linux OS (C) · 60MB RAM · mDNS</text>
    </g>
    <g clip-path="url(#t4)">
      <text x="16" y="138" class="tok">hw  </text>
      <text x="52" y="138" class="ttxt">Zephyr RTOS · STM32 · nRF52 · KiCad</text>
      <rect class="cur" x="308" y="127" width="6" height="13" fill="#58A6FF"/>
    </g>

    <!-- Clean Logic Analyzer Trace Strip -->
    <rect x="14" y="156" width="316" height="62" rx="6" fill="#0D1117" stroke="#21262D"/>
    <text x="24" y="172" class="thdr">LOGIC ANALYZER · SPI / 19.5kHz PWM</text>
    <text x="320" y="172" text-anchor="end" class="thdr" fill="#3FB950">LOCKED</text>
    <line x1="22" y1="196" x2="322" y2="196" stroke="#21262D" stroke-dasharray="2 3"/>
    <path class="wave" d="M 24 206 L 44 206 L 44 184 L 68 184 L 68 206 L 86 206 L 86 184 L 120 184 L 120 206 L 144 206 L 144 184 L 166 184 L 166 206 L 198 206 L 198 184 L 228 184 L 228 206 L 250 206 L 250 184 L 284 184 L 284 206 L 318 206" fill="none" stroke="#3FB950" stroke-width="1.6"/>
  </g>
</svg>
