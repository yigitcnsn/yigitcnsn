name: Update Profile Visuals

on:
  schedule:
    # Run every night at 03:00 UTC (06:00 Istanbul)
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    paths:
      - "scripts/generate_visuals.py"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate live 3D contribution graph & toolbox SVG
        env:
          GITHUB_TOKEN: ${{ secrets.PROFILE_TOKEN || secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: yigitcnsn
        run: python3 scripts/generate_visuals.py

      - name: Commit and push updated SVGs if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/city.svg assets/toolbox.svg
          if ! git diff --cached --quiet; then
            git commit -m "chore(profile): refresh live 3D contribution graph"
            git push
          else
            echo "No changes to commit."
          fi
